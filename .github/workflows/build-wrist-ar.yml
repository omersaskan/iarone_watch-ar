name: Build wrist AR model

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/build-wrist-ar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model build dependencies
        run: python -m pip install --upgrade numpy pillow opencv-python-headless

      - name: Build wear-mode GLB
        run: |
          python tools/build.py --wear
          mv iarone_watch_ar.glb iarone-watch-ar.glb

      - name: Commit generated wrist model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iarone-watch-ar.glb
          if git diff --cached --quiet; then
            echo "wear model unchanged"
            exit 0
          fi
          git commit -m "build: regenerate wrist AR model"
          git push origin HEAD:${GITHUB_REF_NAME}
